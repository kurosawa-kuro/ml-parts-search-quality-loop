# PoC初期設定。パスは env/project.yaml の repoRoot を基準に解決する。
# make config-check で検証可能。nullの必須項目は該当工程の開始前に確定する。
# 秘密値はここに書かず env/secret.yaml または secret manager から取得する。
schemaVersion: 1
projectName: parts-search-quality-loop
appEnv: local
executionMode: batch
logLevel: info

paths:
  artifacts: artifacts
  references: references/github
  activeRelease: artifacts/active.json

artifacts:
  schemaVersion: 1
  metadataFormat: json
  recordsFormat: jsonl
  encoding: utf-8
  checksum: sha256
  immutableSnapshots: true
  atomicPublish: true

catalog:
  domain: fa_parts
  skuCount: 10000
  languages: [ja, en]
  seed: 42
  # カテゴリ別の属性・単位・許容差を定義した後に設定する。
  attributePolicyId: fa_parts_attr_v1

queries:
  familyCount: 1000
  types: [exact_model_number, natural_language, dimension_sensitive]
  generationSeed: 43

split:
  unit: family_id
  seed: 44
  ratios:
    train: 0.60
    tuning: 0.15
    holdout: 0.15
    production: 0.10
  generationSeeds:
    train: 42
    tuning: 73
    holdout: 137
    production: 999
  allowFamilyOverlap: false
  sharedCatalog: true

retrieval:
  backend: qdrant
  candidateLimit: 100
  resultLimit: 100
  tieBreak: product_id_asc
  qdrant:
    url: http://localhost:6333
    collectionPrefix: parts_search
    timeoutSeconds: 15
    apiKeySecret: DB_QDRANT_API_KEY
  embedding:
    # 決定 2026-09-22。revision は必ず commit SHA（タグ・main 不可）。
    # 05「index は catalog・embedding revision・前処理設定の checksum から識別」を満たすため。
    # 実測: sentence-transformers 3.0.1 で revision 指定ロード・384dim・決定的を確認済み。
    modelId: intfloat/multilingual-e5-small
    revision: 614241f622f53c4eeff9890bdc4f31cfecc418b3
    preprocessingVersion: parts_e5_v1
  hybrid:
    enabled: false
  structuredFilter:
    enabled: false

features:
  # 型・順序・欠損規約を定義したFeatureSchemaへ結びつける。
  schemaId: parts_features_v1

ranker:
  implementation: lightgbm
  objective: lambdarank
  seed: 42
  labelGain: [0, 0, 1, 3, 7]
  fitSplit: train
  tuningSplit: tuning

judgments:
  policyId: parts_gt_v1
  requireCompleteEvaluation: true
  promoteImplicitToEvaluation: false

evaluation:
  policyId: parts_metrics_v1
  implementation: ir_measures
  # 導入時に互換性を確認して依存lockとともに固定する。
  version: '0.4.3'
  provider: ir_measures
  ndcgCutoff: 10
  recallCutoff: 100
  mrrCutoff: 100
  relevanceThreshold: 2
  gainByRelevance: [0, 0, 1, 3, 7]
  dcgFormula: gain_over_log2_rank_plus_one
  aggregation: query_macro
  noRelevantPolicy: exclude_and_report
  incompletePolicy: inconclusive
  slices: [language, query_type, category]

qualityGate:
  # baseline測定後、candidate比較前に固定。nullなら採用判定不可。
  policyId: parts_gate_v1
  minNdcgDelta: 0.01
  maxRegression:
    recallAt100: 0.01
    mrrAt100: 0.01
    sliceNdcgAt10: 0.01
    searchSuccessRate: 0.01
    wrongFitmentRate: 0.005
  minSliceQueries: 30
  repetitionSeeds: [11, 22, 33]

simulation:
  # T7 で確率と分布を具体化し版付きで固定（2026-09-22）。null が残る間は開始しない。
  enabled: true
  policyId: parts_sim_v1
  policyVersion: parts_sim_v1.0.0
  observationWindowSeconds: 1800
  behaviorModel: position_biased_cascade_v1
  developmentSplit: tuning
  validationSplit: production
  pairedRandomStreams: true
  sessionsPerQuery: 4
  # 位置バイアス: examine(rank) = 1 / rank**decay（cascade の examine 確率）。
  positionBias:
    model: inverse_rank_power
    decay: 1.0
  # relevance>=3 を relevant、==2 を marginal、それ未満を irrelevant とみなす。
  clickProbability:
    relevant: 0.65
    marginal: 0.30
    irrelevant: 0.03
  conversionProbabilityGivenClick: 0.25
  reformulationProbability:
    zeroResult: 0.80
    noClick: 0.45
    afterClick: 0.05
  # 観測窓の外へずれる遅着 interaction を作る幅（結合されず隔離されることの検査に使う）。
  lateInteractionSeconds: 2400
  seed: 777

retry:
  retrievalMaxAttempts: 3
  backoffSeconds: [1, 2]

release:
  mode: local_simulation
  requireAcceptedDecision: true
  requireSmoke: true
  preservePreviousBundle: true
