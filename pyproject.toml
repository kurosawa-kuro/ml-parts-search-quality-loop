[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "parts-search-quality-loop"
version = "0.1.0"
description = "Reproducible foundation for a parts search quality improvement loop"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0.2,<7", "jsonschema>=4.23,<5"]

[project.scripts]
parts-search = "parts_search.cli:main"

[dependency-groups]
# ライブラリは同一 minor に固定する（.claude/rules/python.md）。
dev = ["ruff>=0.11,<1", "pytest>=8.4,<8.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# 既定の `make test` は単体・CLI 結合のみ。実接続テストは marker で外に出す
# （.claude/rules/tests.md「実接続テストは明示マークで分け、既定の make test から外す」）。
# unittest には marker 機構が無くこの契約を満たせないため pytest を使う。
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config -m 'not integration'"
markers = [
  "integration: 実サービス（ローカル Qdrant 等）へ接続する。既定の実行から除外する",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
