[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "parts-search-quality-loop"
version = "0.1.0"
description = "Reproducible foundation for a parts search quality improvement loop"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0.2,<7", "jsonschema>=4.23,<5"]

[project.scripts]
parts-search = "parts_search_quality_loop.cli:main"

[dependency-groups]
dev = ["ruff>=0.11,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
